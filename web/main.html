<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>MC Bot Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="btn-menu-toggle" title="Show bots">☰</button>
<div id="sidebar-scrim"></div>
<div id="sidebar">
    <div id="sidebar-header">
        <span class="sidebar-title">BOTS</span>
        <button id="btn-add-bot" title="Add new bot">＋</button>
    </div>
    <div id="bot-tabs"></div>
</div>

<div id="main">
    <div id="no-bots-msg">Click <strong>＋</strong> in the sidebar to add a bot.</div>
</div>

<div id="modal-overlay" class="hidden">
    <div id="modal">
        <h3>New Bot</h3>
        <label>Label (nickname)</label>
        <input type="text" id="modal-label" placeholder="e.g. Bone Farmer">
        <label>Auth Type</label>
        <select id="modal-auth">
            <option value="offline">Offline / Cracked</option>
            <option value="microsoft">Microsoft (Java)</option>
            <option value="bedrock">Bedrock (via Floodgate)</option>
        </select>
        <div class="modal-buttons">
            <button id="modal-cancel" class="btn-disconnect">Cancel</button>
            <button id="modal-confirm" class="btn-launch">Create</button>
        </div>
    </div>
</div>

<style>
/* ── Module selector ────────────────────────────────────── */
.module-card {
    border: 1px solid #1a2a3a;
    background: linear-gradient(135deg, #0a1520 0%, #111 100%);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}
.module-card h3 { color: #4a9eff; margin: 0 0 12px; text-align: center; }
.module-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 14px;
}
.module-btn {
    padding: 7px 14px;
    border-radius: 5px;
    border: 1px solid #2a3a4a;
    background: #0d1a26;
    color: #aaa;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
}
.module-btn:hover { border-color: #4a9eff; color: #fff; }
.module-btn.active {
    background: #1a3a5a;
    border-color: #4a9eff;
    color: #4a9eff;
    font-weight: bold;
}

/* ── Module config panels ───────────────────────────────── */
.module-config { display: none; }
.module-config.visible { display: block; }

/* ── Spawner coords ─────────────────────────────────────── */
.spawner-card {
    border: 1px solid #2a4a2a;
    background: #0a140a;
    border-radius: 6px;
    padding: 14px;
    margin-top: 10px;
}
.spawner-card h4 { color: #4caf50; margin: 0 0 10px; text-align: center; font-size: 13px; }
.coords-row { display: flex; gap: 10px; }
.coord-field { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.coord-field label { font-size: 11px; font-weight: bold; color: #4caf50; letter-spacing: 1px; }
.coord-field input {
    width: 100%; text-align: center;
    background: #050d05; border: 1px solid #2a4a2a;
    color: #eee; border-radius: 4px; padding: 6px 4px; font-size: 13px;
    box-sizing: border-box;
}
.coord-field input:focus { outline: none; border-color: #4caf50; box-shadow: 0 0 5px rgba(76,175,80,0.3); }
.coord-field input::-webkit-outer-spin-button,
.coord-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
.coord-field input[type=number] { -moz-appearance: textfield; }
.coords-display { text-align: center; margin-top: 8px; font-size: 11px; color: #555; font-family: monospace; }
.coords-display strong { color: #4caf50; }

/* ── Elytra config ──────────────────────────────────────── */
.elytra-card {
    border: 1px solid #4a2a4a;
    background: #140a14;
    border-radius: 6px;
    padding: 14px;
    margin-top: 10px;
}
.elytra-card h4 { color: #c97ae8; margin: 0 0 10px; text-align: center; font-size: 13px; }
.elytra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.elytra-field { display: flex; flex-direction: column; gap: 4px; }
.elytra-field label { font-size: 11px; font-weight: bold; color: #c97ae8; letter-spacing: 1px; }
.elytra-field input {
    text-align: center;
    background: #0a050a; border: 1px solid #4a2a4a;
    color: #eee; border-radius: 4px; padding: 6px 4px; font-size: 13px;
}
.elytra-field input:focus { outline: none; border-color: #c97ae8; box-shadow: 0 0 5px rgba(201,122,232,0.3); }
.elytra-field input::-webkit-outer-spin-button,
.elytra-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
.elytra-field input[type=number] { -moz-appearance: textfield; }
.elytra-hint { text-align: center; color: #555; font-size: 11px; margin: 8px 0 0; }

/* ── Zigzag config ──────────────────────────────────────── */
.zigzag-card {
    border: 1px solid #2a4a4a;
    background: #0a1414;
    border-radius: 6px;
    padding: 14px;
    margin-top: 10px;
}
.zigzag-card h4 { color: #4ae8d0; margin: 0 0 10px; text-align: center; font-size: 13px; }
.zigzag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.zigzag-field { display: flex; flex-direction: column; gap: 4px; }
.zigzag-field label { font-size: 11px; font-weight: bold; color: #4ae8d0; letter-spacing: 1px; }
.zigzag-field input {
    text-align: center;
    background: #050f0f; border: 1px solid #2a4a4a;
    color: #eee; border-radius: 4px; padding: 6px 4px; font-size: 13px;
}
.zigzag-field input:focus { outline: none; border-color: #4ae8d0; box-shadow: 0 0 5px rgba(74,232,208,0.3); }
.zigzag-field input::-webkit-outer-spin-button,
.zigzag-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
.zigzag-field input[type=number] { -moz-appearance: textfield; }
.zigzag-hint { text-align: center; color: #2a6a6a; font-size: 11px; margin: 8px 0 0; }
.zigzag-computed { text-align: center; margin-top: 6px; font-size: 11px; color: #555; font-family: monospace; }
.zigzag-computed strong { color: #4ae8d0; }

/* ── Idle card ──────────────────────────────────────────── */
.idle-msg { text-align: center; color: #555; font-size: 13px; padding: 10px 0; }
</style>

<script>
const socket = io();
let activeBotId = null;
const botData = {};

// ── Local persistence (per-browser, cracked accounts only, no encryption) ─────
// Each bot gets a permanent random localId the moment it's created, and every
// saved profile is keyed by that localId (NOT by label) -- this is what lets
// multiple bots with the same/default name save independently instead of
// clobbering each other.
const STORAGE_KEY = 'mcbot_profiles';

function generateLocalId() {
    if (window.crypto?.randomUUID) return crypto.randomUUID();
    return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}
function loadProfiles() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveProfiles(profiles) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles)); }
    catch (e) { console.warn('Could not save bot profiles:', e); }
}
function findLocalIdByLabel(label) {
    const profiles = loadProfiles();
    for (const [lid, p] of Object.entries(profiles)) if (p.label === label) return lid;
    return null;
}
function saveProfileFor(id) {
    const bd = botData[id];
    if (!bd || !bd.localId) return;
    const profiles = loadProfiles();
    const profile = {
        label:    bd.label,
        authType: bd.authType,
        module:   bd.module || 'none',
        host:     document.getElementById(`host_${id}`)?.value || '',
        username: document.getElementById(`user_${id}`)?.value || '',
        password: document.getElementById(`pass_${id}`)?.value || '',
        version:  document.getElementById(`version_${id}`)?.value || '1.20.1',
        moduleConfig: {}
    };
    // module-specific fields, saved regardless of which is active
    ['sx','sy','sz'].forEach(f => { const el = document.getElementById(`${f}_${id}`); if (el) profile.moduleConfig[f] = el.value; });
    ['ex_start','ez_start','ex_end','ez_end','ex_step'].forEach(f => { const el = document.getElementById(`${f}_${id}`); if (el) profile.moduleConfig[f] = el.value; });
    ['zfx_first','zfz_first','zfx_len','zfz_step'].forEach(f => { const el = document.getElementById(`${f}_${id}`); if (el) profile.moduleConfig[f] = el.value; });
    profiles[bd.localId] = profile;
    saveProfiles(profiles);
}
function restoreProfileFor(id, localId) {
    const profiles = loadProfiles();
    const profile = profiles[localId];
    if (!profile) return;

    const setVal = (fieldId, val) => { const el = document.getElementById(fieldId); if (el && val !== undefined) el.value = val; };
    setVal(`host_${id}`, profile.host);
    setVal(`user_${id}`, profile.username);
    setVal(`pass_${id}`, profile.password);
    setVal(`version_${id}`, profile.version);

    if (profile.moduleConfig) {
        Object.entries(profile.moduleConfig).forEach(([f, v]) => setVal(`${f}_${id}`, v));
    }
    if (profile.module) selectModule(id, profile.module);
    updateSpawnerDisplay(id);
    updateZigzagDisplay(id);
}
function deleteProfile(localId) {
    if (!localId) return;
    const profiles = loadProfiles();
    delete profiles[localId];
    saveProfiles(profiles);
}

// Queue used to match this browser's "create_bot" requests back up with the
// server's "bot_added" replies, since the server doesn't know about localIds.
const pendingCreateQueue = [];

// ── Module definitions ────────────────────────────────────────────────────────
const MODULES = [
    { id: 'none',          label: '⬜ Idle'          },
    { id: 'spawnerLoot',   label: '💀 Spawner Loot'  },
    { id: 'farming',       label: '🌾 Farming'        },
    { id: 'elytraFlight',  label: '🦅 Elytra Flight'  },
    { id: 'zigzagFlight',  label: '🪂 Zigzag Flight'  },
];

function addBotTab(id, label, authType, localId) {
    if (!localId) localId = findLocalIdByLabel(label) || generateLocalId();
    botData[id] = { allPlayers: [], label, authType, module: 'none', localId };

    const tab = document.createElement('div');
    tab.className = 'bot-tab';
    tab.id = `tab_${id}`;
    tab.innerHTML = `
        <span class="tab-dot status-dot offline" id="dot_${id}"></span>
        <span class="tab-label">${label}</span>
        <button class="tab-remove" title="Remove bot" onclick="removeBot('${id}', event)">✕</button>
    `;
    tab.addEventListener('click', () => { switchBot(id); closeSidebarOnMobile(); });
    document.getElementById('bot-tabs').appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'bot-panel hidden';
    panel.id = `panel_${id}`;
    panel.innerHTML = buildPanelHTML(id, label, authType);
    document.getElementById('main').appendChild(panel);

    document.getElementById('no-bots-msg').classList.add('hidden');
    switchBot(id);
    wirePanel(id);
    restoreProfileFor(id, localId);
    // Make sure this bot is saved right away, even if the user never edits a field.
    if (!loadProfiles()[localId]) saveProfileFor(id);
}

function buildPanelHTML(id, label, authType) {
    const msAuthNotice = authType === 'microsoft'
        ? `<div id="ms-auth-box_${id}" class="ms-auth-box hidden">
               <p>🔗 Microsoft Login Required:</p>
               <a id="ms-auth-link_${id}" href="#" target="_blank">Open login page</a>
               <span id="ms-auth-code_${id}" class="ms-code"></span>
           </div>` : '';

    const bedrockNote = authType === 'bedrock'
        ? `<small style="color:#888;display:block;margin-top:4px;">Bedrock: username must start with <code>.</code> if using Floodgate.</small>` : '';

    const moduleBtns = MODULES.map(m =>
        `<button class="module-btn${m.id === 'none' ? ' active' : ''}"
            id="modbtn_${m.id}_${id}"
            onclick="selectModule('${id}', '${m.id}')">${m.label}</button>`
    ).join('');

    return `
    <div class="panel-header">
        <h2>${label}</h2>
        <span class="auth-badge auth-${authType}">${authType.toUpperCase()}</span>
    </div>

    <div class="OnlinePlayers">
        <h3 style="text-align:center;">Online Players (<span id="player-count_${id}">0</span>)</h3>
        <div id="player-list_${id}" class="player-grid"></div>
    </div>

    <div class="card">
        <h3 style="text-align:center;">Bot Configuration</h3>
        ${msAuthNotice}${bedrockNote}
        <div class="input-group">
            <input type="text"     id="host_${id}"    placeholder="Server IP"         value="mcsmp.gg" oninput="saveProfileFor('${id}')">
            <input type="text"     id="user_${id}"    placeholder="Bot Username"       value="dominance1" oninput="saveProfileFor('${id}')">
            <input type="password" id="pass_${id}"    placeholder="Password (/login)" oninput="saveProfileFor('${id}')">
            <select id="version_${id}" onchange="saveProfileFor('${id}')">
                <option value="1.20.1">1.20.1</option>
                <option value="1.19.4">1.19.4</option>
                <option value="1.18.2">1.18.2</option>
                <option value="1.17.1">1.17.1</option>
                <option value="1.16.5">1.16.5</option>
            </select>
        </div>
        <div class="button-group">
            <button class="btn-launch" onclick="launchBot('${id}')">LAUNCH</button>
            <button class="btn-disconnect" style="background:#552222;" onclick="abortModule('${id}')">ABORT MODULE</button>
            <button class="btn-disconnect" onclick="stopBot('${id}')">DISCONNECT</button>
        </div>
        <div class="status-bar">
            <span id="status-dot_${id}" class="status-dot offline"></span>
            Status: <span id="status-text_${id}">Disconnected</span>
        </div>
    </div>

    <!-- Module Selector -->
    <div class="module-card">
        <h3>🧩 Module</h3>
        <div class="module-tabs">${moduleBtns}</div>

        <!-- none -->
        <div class="module-config visible" id="modcfg_none_${id}">
            <p class="idle-msg">Bot will connect and stand idle — no automation.</p>
        </div>

        <!-- spawnerLoot -->
        <div class="module-config" id="modcfg_spawnerLoot_${id}">
            <div class="spawner-card">
                <h4>⚙ Spawner Block Coordinates</h4>
                <div class="coords-row">
                    <div class="coord-field">
                        <label>X</label>
                        <input type="number" id="sx_${id}" value="70868" oninput="updateSpawnerDisplay('${id}'); saveProfileFor('${id}')">
                    </div>
                    <div class="coord-field">
                        <label>Y</label>
                        <input type="number" id="sy_${id}" value="249"   oninput="updateSpawnerDisplay('${id}'); saveProfileFor('${id}')">
                    </div>
                    <div class="coord-field">
                        <label>Z</label>
                        <input type="number" id="sz_${id}" value="-2132" oninput="updateSpawnerDisplay('${id}'); saveProfileFor('${id}')">
                    </div>
                </div>
                <div class="coords-display" id="spawner-display_${id}">
                    Spawner: <strong>70868, 249, -2132</strong>
                </div>
            </div>
        </div>

        <!-- farming -->
        <div class="module-config" id="modcfg_farming_${id}">
            <p class="idle-msg">🌾 Farming module — uses hardcoded farm offsets in farming.js.<br>No extra config needed.</p>
        </div>

        <!-- elytraFlight -->
        <div class="module-config" id="modcfg_elytraFlight_${id}">
            <div class="elytra-card">
                <h4>🦅 Elytra Zigzag Route</h4>
                <div class="elytra-grid">
                    <div class="elytra-field">
                        <label>START X</label>
                        <input type="number" id="ex_start_${id}" value="0"    placeholder="0" oninput="saveProfileFor('${id}')">
                    </div>
                    <div class="elytra-field">
                        <label>START Z</label>
                        <input type="number" id="ez_start_${id}" value="0"    placeholder="0" oninput="saveProfileFor('${id}')">
                    </div>
                    <div class="elytra-field">
                        <label>END X</label>
                        <input type="number" id="ex_end_${id}"   value="1000" placeholder="1000" oninput="saveProfileFor('${id}')">
                    </div>
                    <div class="elytra-field">
                        <label>END Z</label>
                        <input type="number" id="ez_end_${id}"   value="1000" placeholder="1000" oninput="saveProfileFor('${id}')">
                    </div>
                    <div class="elytra-field" style="grid-column:span 2">
                        <label>COLUMN STEP (X spacing)</label>
                        <input type="number" id="ex_step_${id}"  value="100"  placeholder="100" oninput="saveProfileFor('${id}')">
                    </div>
                </div>
                <p class="elytra-hint">Bot zigzags columns every STEP blocks from Start X→End X, alternating Z.</p>
            </div>
        </div>

        <!-- zigzagFlight -->
        <div class="module-config" id="modcfg_zigzagFlight_${id}">
            <div class="zigzag-card">
                <h4>🪂 Infinite Cannon Zigzag</h4>
                <div class="zigzag-grid">
                    <div class="zigzag-field">
                        <label>FIRST DEST X</label>
                        <input type="number" id="zfx_first_${id}" value="74895" oninput="updateZigzagDisplay('${id}'); saveProfileFor('${id}')">
                    </div>
                    <div class="zigzag-field">
                        <label>FIRST DEST Z</label>
                        <input type="number" id="zfz_first_${id}" value="25" oninput="updateZigzagDisplay('${id}'); saveProfileFor('${id}')">
                    </div>
                    <div class="zigzag-field">
                        <label>X LENGTH</label>
                        <input type="number" id="zfx_len_${id}" value="-49776" oninput="updateZigzagDisplay('${id}'); saveProfileFor('${id}')">
                    </div>
                    <div class="zigzag-field">
                        <label>Z STEP</label>
                        <input type="number" id="zfz_step_${id}" value="224" oninput="saveProfileFor('${id}')">
                    </div>
                </div>
                <div class="zigzag-computed" id="zigzag-display_${id}"></div>
                <p class="zigzag-hint">Bot will zigzag indefinitely until ABORT is clicked.</p>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin">
        <h3 style="text-align:center;">Admin Panel</h3>
        <div class="input-group">
            <select id="commands_${id}">
                <option value="/ipmute ">/ipmute</option>
                <option value="/ban ">/ban</option>
                <option value="/kick ">/kick</option>
                <option value="/mute ">/mute</option>
                <option value="/warn ">/warn</option>
            </select>
            <div class="search-wrapper">
                <input type="text" id="player-search_${id}" placeholder="Search player..." autocomplete="off">
                <div id="search-results_${id}" class="custom-dropdown"></div>
            </div>
            <input type="text" id="time_${id}"    placeholder="time">
            <input type="text" id="reason_${id}"  placeholder="reason">
            <input type="text" id="offense_${id}" placeholder="offense (2nd)">
            <button class="btn-send" onclick="sendToSelected('${id}')">SEND</button>
        </div>
    </div>

    <div id="console_${id}" class="console"></div>

    <div class="card" style="margin-top:20px;">
        <div class="input-group">
            <input type="text" id="cmd_${id}" placeholder="Type a message or command..." style="flex:4;"
                onkeypress="if(event.key==='Enter') sendCmd('${id}')">
            <button class="btn-send" onclick="sendCmd('${id}')">SEND</button>
        </div>
    </div>
    `;
}

// ── Module selector ───────────────────────────────────────────────────────────
function selectModule(id, mod) {
    botData[id].module = mod;
    MODULES.forEach(m => {
        const btn = document.getElementById(`modbtn_${m.id}_${id}`);
        if (btn) btn.classList.toggle('active', m.id === mod);
        const cfg = document.getElementById(`modcfg_${m.id}_${id}`);
        if (cfg) cfg.classList.toggle('visible', m.id === mod);
    });
    saveProfileFor(id);
}

function updateSpawnerDisplay(id) {
    const x = document.getElementById(`sx_${id}`)?.value || '?';
    const y = document.getElementById(`sy_${id}`)?.value || '?';
    const z = document.getElementById(`sz_${id}`)?.value || '?';
    const el = document.getElementById(`spawner-display_${id}`);
    if (el) el.innerHTML = `Spawner: <strong>${x}, ${y}, ${z}</strong>`;
}

function updateZigzagDisplay(id) {
    const firstX  = parseInt(document.getElementById(`zfx_first_${id}`)?.value) || 0;
    const firstZ  = parseInt(document.getElementById(`zfz_first_${id}`)?.value) || 0;
    const xLen    = parseInt(document.getElementById(`zfx_len_${id}`)?.value)   || 0;
    const returnX = firstX + xLen;
    const el = document.getElementById(`zigzag-display_${id}`);
    if (el) el.innerHTML =
        `First dest: <strong>X ${firstX}, Z ${firstZ}</strong> &nbsp;·&nbsp; Return X: <strong>${returnX}</strong>`;
}

function abortModule(id) {
    socket.emit('stop_module', { id });
    appendConsole(id, '[SYSTEM] Abort signal sent.');
}

// ── Bot actions ───────────────────────────────────────────────────────────────
function launchBot(id) {
    const mod = botData[id]?.module || 'none';

    const data = {
        id,
        host:     document.getElementById(`host_${id}`).value,
        username: document.getElementById(`user_${id}`).value,
        password: document.getElementById(`pass_${id}`).value,
        version:  document.getElementById(`version_${id}`).value,
        authType: botData[id]?.authType || 'offline',
        label:    botData[id]?.label,
        module:   mod,
    };

    if (!data.username) { alert('Please enter a username.'); return; }

    if (mod === 'spawnerLoot') {
        data.spawnerX = parseInt(document.getElementById(`sx_${id}`)?.value) || 0;
        data.spawnerY = parseInt(document.getElementById(`sy_${id}`)?.value) || 0;
        data.spawnerZ = parseInt(document.getElementById(`sz_${id}`)?.value) || 0;
    }

    if (mod === 'elytraFlight') {
        data.elytraStartX = parseInt(document.getElementById(`ex_start_${id}`)?.value) || 0;
        data.elytraStartZ = parseInt(document.getElementById(`ez_start_${id}`)?.value) || 0;
        data.elytraEndX   = parseInt(document.getElementById(`ex_end_${id}`)?.value)   || 1000;
        data.elytraEndZ   = parseInt(document.getElementById(`ez_end_${id}`)?.value)   || 1000;
        data.elytraStepX  = parseInt(document.getElementById(`ex_step_${id}`)?.value)  || 100;
    }

    if (mod === 'zigzagFlight') {
        data.zigFirstX  = parseInt(document.getElementById(`zfx_first_${id}`)?.value);
        data.zigFirstZ  = parseInt(document.getElementById(`zfz_first_${id}`)?.value);
        data.zigXLength = parseInt(document.getElementById(`zfx_len_${id}`)?.value);
        data.zigZStep   = parseInt(document.getElementById(`zfz_step_${id}`)?.value);
    }

    saveProfileFor(id);
    appendConsole(id, `[SYSTEM] Launching with module: ${mod}`);
    socket.emit('start_bot', data);
}

function stopBot(id)  { socket.emit('stop_bot',   { id }); }
function removeBot(id, e) {
    e.stopPropagation();
    const bd = botData[id];
    if (bd && confirm(`Remove "${bd.label}" permanently? This also deletes its saved config.`)) {
        deleteProfile(bd.localId);
        socket.emit('remove_bot', { id });
    }
}

function sendCmd(id) {
    const input = document.getElementById(`cmd_${id}`);
    if (input.value.trim()) {
        socket.emit('command_from_web', { id, cmd: input.value });
        input.value = '';
    }
}

function sendToSelected(id) {
    const player  = document.getElementById(`player-search_${id}`).value.trim();
    const command = document.getElementById(`commands_${id}`).value;
    const time    = document.getElementById(`time_${id}`).value.trim();
    const reason  = document.getElementById(`reason_${id}`).value.trim();
    const offense = document.getElementById(`offense_${id}`).value.trim();
    if (!player) { alert('You must select a player first!'); return; }
    socket.emit('command_from_web', { id, cmd: `${command}${player} ${time} ${reason} ${offense}`.trim() });
    ['player-search', 'time', 'reason', 'offense'].forEach(f => {
        const el = document.getElementById(`${f}_${id}`);
        if (el) el.value = '';
    });
    document.getElementById(`search-results_${id}`).style.display = 'none';
}

function switchBot(id) {
    activeBotId = id;
    document.querySelectorAll('.bot-panel').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.bot-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`panel_${id}`)?.classList.remove('hidden');
    document.getElementById(`tab_${id}`)?.classList.add('active');
}

function appendConsole(id, msg) {
    const c = document.getElementById(`console_${id}`);
    if (!c) return;
    const line = document.createElement('div');
    line.textContent = msg;
    c.appendChild(line);
    c.scrollTop = c.scrollHeight;
}

function wirePanel(id) {
    const searchInput = document.getElementById(`player-search_${id}`);
    const resultsDiv  = document.getElementById(`search-results_${id}`);
    searchInput.addEventListener('input', () => {
        const val = searchInput.value.toLowerCase();
        resultsDiv.innerHTML = '';
        if (!val) { resultsDiv.style.display = 'none'; return; }
        const matches = (botData[id]?.allPlayers || []).filter(p => p.toLowerCase().includes(val));
        if (matches.length > 0) {
            resultsDiv.style.display = 'block';
            matches.forEach(name => {
                const div = document.createElement('div');
                div.classList.add('dropdown-item');
                div.textContent = name;
                div.onclick = () => { searchInput.value = name; resultsDiv.style.display = 'none'; };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = 'none';
        }
    });
}

// ── Mobile sidebar helpers ──────────────────────────────────────────────────
function setSidebarOpen(open) {
    document.getElementById('sidebar')?.classList.toggle('open', open);
    document.getElementById('sidebar-scrim')?.classList.toggle('visible', open);
}
function closeSidebarOnMobile() {
    if (window.innerWidth <= 760) setSidebarOpen(false);
}

// ── Socket events ─────────────────────────────────────────────────────────────
let liveListReceived = false;

socket.on('bot_list',  (list) => {
    list.forEach(({ id, label, authType }) => { if (!botData[id]) addBotTab(id, label, authType, findLocalIdByLabel(label)); });
    liveListReceived = true;
    replayMissingSavedBots(list.map(b => b.label));
});
socket.on('bot_added', (payload) => {
    const { id, label, authType } = payload;
    if (botData[id]) return;
    let localId = payload.localId;
    if (!localId && pendingCreateQueue.length) localId = pendingCreateQueue.shift().localId;
    if (!localId) localId = findLocalIdByLabel(label) || generateLocalId();
    addBotTab(id, label, authType, localId);
    subscribeToBot(id);
});
socket.on('bot_removed', ({ id }) => {
    delete botData[id];
    document.getElementById(`tab_${id}`)?.remove();
    document.getElementById(`panel_${id}`)?.remove();
    const remaining = Object.keys(botData);
    if (remaining.length === 0) { activeBotId = null; document.getElementById('no-bots-msg').classList.remove('hidden'); }
    else switchBot(remaining[0]);
});

// Recreate tabs (server-side) for any bot we've saved locally that the server
// doesn't currently know about (e.g. after a `node server.js` restart).
function replayMissingSavedBots(liveLabels) {
    const profiles = loadProfiles();
    Object.entries(profiles).forEach(([localId, profile]) => {
        if (!liveLabels.includes(profile.label)) {
            pendingCreateQueue.push({ localId, label: profile.label, authType: profile.authType || 'offline' });
            socket.emit('create_bot', { label: profile.label, authType: profile.authType || 'offline', localId });
        }
    });
}
// Fallback: if the server never emits bot_list (e.g. it's not implemented),
// still restore saved bots after a short delay.
setTimeout(() => { if (!liveListReceived) replayMissingSavedBots([]); }, 800);

const subscribedIds = new Set();
function subscribeToBot(id) {
    if (subscribedIds.has(id)) return;
    subscribedIds.add(id);

    socket.on(`bot_status_${id}`, (status) => {
        const txt    = document.getElementById(`status-text_${id}`);
        const dot    = document.getElementById(`status-dot_${id}`);
        const tabDot = document.getElementById(`dot_${id}`);
        if (txt) txt.innerText = status;
        const online = status.includes('Active') || status.includes('Limbo') || status.includes('Loaded');
        [dot, tabDot].forEach(d => { if (d) d.className = 'status-dot ' + (online ? 'online' : 'offline'); });
    });

    socket.on(`bot_chat_${id}`,    (msg)     => appendConsole(id, msg));
    socket.on(`player_list_${id}`, (players) => {
        if (!botData[id]) return;
        botData[id].allPlayers = players;
        const countEl = document.getElementById(`player-count_${id}`);
        const listEl  = document.getElementById(`player-list_${id}`);
        if (countEl) countEl.innerText = players.length;
        if (listEl)  listEl.innerHTML  = players.map(n => `<div>${n}</div>`).join('');
    });

    socket.on(`ms_auth_${id}`, ({ url, code }) => {
        const box    = document.getElementById(`ms-auth-box_${id}`);
        const link   = document.getElementById(`ms-auth-link_${id}`);
        const codeEl = document.getElementById(`ms-auth-code_${id}`);
        if (!box) return;
        box.classList.remove('hidden');
        link.href = url; link.textContent = url;
        if (codeEl) codeEl.textContent = `Code: ${code}`;
    });
}

document.getElementById('btn-menu-toggle')?.addEventListener('click', () => setSidebarOpen(!document.getElementById('sidebar')?.classList.contains('open')));
document.getElementById('sidebar-scrim')?.addEventListener('click', () => setSidebarOpen(false));

document.getElementById('btn-add-bot').addEventListener('click',   () => document.getElementById('modal-overlay').classList.remove('hidden'));
document.getElementById('modal-cancel').addEventListener('click',   () => document.getElementById('modal-overlay').classList.add('hidden'));
document.getElementById('modal-confirm').addEventListener('click',  () => {
    let label     = document.getElementById('modal-label').value.trim() || 'New Bot';
    const authType = document.getElementById('modal-auth').value;

    // Guarantee a unique label so it's easy to tell bots apart in the sidebar
    // (saved profiles are keyed by a hidden localId either way, but duplicate
    // names are confusing to look at).
    const existingLabels = Object.values(botData).map(b => b.label);
    if (existingLabels.includes(label)) {
        let n = 2;
        while (existingLabels.includes(`${label} (${n})`)) n++;
        label = `${label} (${n})`;
    }

    const localId = generateLocalId();
    pendingCreateQueue.push({ localId, label, authType });

    // Save a stub profile immediately so it survives even if bot_added never
    // comes back (e.g. server offline) or the user never edits a field.
    const profiles = loadProfiles();
    profiles[localId] = {
        label, authType, module: 'none',
        host: 'mcsmp.gg', username: 'dominance1', password: '', version: '1.20.1',
        moduleConfig: {}
    };
    saveProfiles(profiles);

    socket.emit('create_bot', { label, authType, localId });
    document.getElementById('modal-overlay').classList.add('hidden');
    document.getElementById('modal-label').value = '';
});

socket.on('bot_list',  (list)  => list.forEach(b => subscribeToBot(b.id)));

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper'))
        document.querySelectorAll('.custom-dropdown').forEach(d => d.style.display = 'none');
    if (!e.target.closest('#sidebar') && !e.target.closest('#btn-menu-toggle'))
        setSidebarOpen(false);
});
</script>
</body>
</html>
